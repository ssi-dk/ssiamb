[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssiamb"
version = "0.9.1"
description = "Ambiguous-site counting for reads mapped back to their assembly"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Statens Serum Institut" },
]
keywords = [
    "bioinformatics",
    "genomics",
    "variant-calling",
    "bacterial-genomics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/ssi-dk/ssiamb"
Repository = "https://github.com/ssi-dk/ssiamb"
Issues = "https://github.com/ssi-dk/ssiamb/issues"

[project.scripts]
ssiamb = "ssiamb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ssiamb"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/AGENTS.md",
    "/AGENTS-todo.md",
    "/BIOCONDA_SUBMISSION.md",
    "/galaxy",
    "/legacy",
    "/recipes",
    "/smoke_test.py",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
