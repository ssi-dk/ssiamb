name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          black --check src tests smoke_test.py
          ruff check .
          ruff format --check .
          mypy

      - name: Test
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Smoke test installed CLI
        run: |
          ssiamb --version
          ssiamb self --help

  galaxy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Planemo
        run: |
          python -m pip install --upgrade pip
          python -m pip install planemo

      - name: Lint Galaxy wrapper
        run: |
          planemo lint galaxy/ssiamb.xml
          planemo shed_lint --tools
