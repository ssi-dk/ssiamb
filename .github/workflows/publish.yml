name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if tag != version:
              raise SystemExit(f"tag v{tag} does not match package version {version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/ssiamb
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: publish-to-pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ssiamb ${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"

      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/** --repo "${GITHUB_REPOSITORY}"
